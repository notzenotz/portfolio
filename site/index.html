<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/favicon.svg">
<title>Zenitha Portfolio</title>
<meta name="description" content="Portofolio Winodya Zenitha — Teknik Informatika, cloud &amp; DevOps.">
<link rel="preload" href="content.json" as="fetch" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&family=Karla:wght@400;500;700&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--a-water:url(assets/decor/water.gif);}:root{
  --bole:#83513E; --ink:#4A2E23; --fawn:#E7AE75; --wheat:#F6DFB3;
  --rose:#FAD6D3; --salmon:#F28AA1; --salmon-deep:#D4657F;
  --mud:#4A2E23; --silt:#8C6752; --leaf:#5C7A4A;
  --lotus:#F28AA1; --lotus-deep:#D4657F; --gold:#E7AE75;
  --paper:#FBEFE0;
  --w:min(1120px,92vw);
  --step:clamp(.95rem,.66rem + .78vw,1.09rem);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--paper); color:var(--mud);
  font:400 var(--step)/1.62 Karla,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
img{max-width:100%;display:block}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-variation-settings:'SOFT' 60,'WONK' 1;line-height:1.1;margin:0}
.ini{font-family:'Pinyon Script',cursive;font-size:1.55em;line-height:0;font-weight:400;
     color:var(--lotus-deep);padding-right:.02em;font-variation-settings:normal}
.wrap{width:var(--w);margin-inline:auto}
section{position:relative}
a{color:inherit}

/* ---------- 0. cover + doors ---------- */
#cover{height:100svh;min-height:520px;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(168deg,#FEF6EA 0%,#FAD6D3 46%,#F6DFB3 100%)}
.title{text-align:center;padding-inline:6vw;opacity:0}
.title h1{--p:-12%;display:inline-block;padding:.3em .12em .18em;
  --brush:linear-gradient(90deg,#000 0,#000 var(--p),rgba(0,0,0,.45) calc(var(--p) + 3.5%),transparent calc(var(--p) + 9%));
  -webkit-mask-image:var(--brush);mask-image:var(--brush);
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-size:100% 300%;mask-size:100% 300%;
  -webkit-mask-position:0 center;mask-position:0 center}
.title p{opacity:0}
.title h1{font-size:clamp(2.2rem,.9rem + 6.6vw,5.8rem);font-weight:800;letter-spacing:-.02em;
  text-shadow:0 2px 22px rgba(253,240,228,.95),0 0 60px rgba(253,240,228,.85)}
.title p{margin:.9rem auto 0;max-width:34ch;color:var(--silt);font-size:.92rem;
  letter-spacing:.06em;font-style:italic}
.scrollcue{position:absolute;bottom:2.2rem;left:50%;translate:-50% 0;z-index:9;
  padding:.35rem .9rem;border-radius:999px;background:rgba(253,242,230,.72);
  backdrop-filter:blur(3px);color:var(--silt);
  font-size:.74rem;letter-spacing:.24em;opacity:0}
.scrollcue::after{content:"";display:block;width:1px;height:26px;margin:.5rem auto 0;
  background:linear-gradient(var(--silt),transparent);animation:cue 2.4s ease-in-out infinite}
@keyframes cue{0%,100%{transform:scaleY(.4);opacity:.3}50%{transform:scaleY(1);opacity:.9}}

.gate{position:absolute;inset:0;z-index:3;pointer-events:none;--gs:1vmin}
@media(max-width:820px){.gate{--gs:1.6vmin}}
.g{position:absolute;translate:-50% -50%;will-change:transform;
  filter:drop-shadow(0 8px 14px rgba(131,81,62,.22))}
.flutter{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.bf{position:absolute;top:0;left:0;will-change:transform}
.bf img{display:block;width:100%;height:auto;
  filter:drop-shadow(0 4px 5px rgba(74,46,35,.24))}
.glit{position:absolute;border-radius:50%;pointer-events:none;
  box-shadow:0 0 6px 2px rgba(255,240,200,.75)}
.petals{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.pf{position:absolute;top:0;left:0;will-change:transform}
.petal-fall{display:block;width:100%;height:auto;
  filter:drop-shadow(0 2px 3px rgba(120,80,95,.22))}

/* ---------- 1. about ---------- */
#about{padding:clamp(4rem,9vw,7.5rem) 0 clamp(3rem,7vw,6rem);
  background:linear-gradient(172deg,#F6DFB3 0%,#FDF2E6 52%,#FAD6D3 100%)}
#about .wrap{position:relative;display:grid;gap:clamp(2.5rem,5vw,4.5rem);
  grid-template-columns:1.05fr .95fr;align-items:center}
.bio h2{font-size:clamp(1.9rem,1rem + 3vw,3rem);font-weight:700;margin-bottom:.2rem}
.bio .role{color:var(--lotus-deep);font-size:.88rem;letter-spacing:.14em;margin:.15rem 0 1.4rem}
.type{font-size:1.06em;line-height:1.66}
.wd{display:inline-block;will-change:transform,filter}
.edu{margin:2rem 0 0;padding:1.1rem 0 0;border-top:1px solid rgba(131,81,62,.22)}
.edu dt{font-weight:700;font-size:.95rem}
.edu dd{margin:.1rem 0 1rem;color:var(--silt);font-size:.88rem}
.edu dd span{display:inline-block;margin-right:1.1rem}
.soft dd.stack{margin:.5rem 0 .2rem;gap:.4rem}
.soft .stack span{margin:0;font-size:.8rem;padding:.26rem .72rem}
.soft + .edu{margin-top:1.1rem}
.toolwrap h3{font-size:.82rem;letter-spacing:.07em;color:var(--silt);font-weight:600;
  font-variation-settings:'SOFT' 0,'WONK' 0;margin-bottom:.9rem}
.tools{display:flex;flex-wrap:wrap;gap:.5rem}
.tool{display:inline-flex;align-items:center;gap:.42rem;padding:.42rem .78rem;border-radius:999px;
  background:rgba(255,252,247,.82);border:1px solid rgba(131,81,62,.18);font-size:.82rem;
  font-weight:500;opacity:0;transform:scale(.5)}
.tool.lit{border-color:transparent;box-shadow:0 2px 6px rgba(131,81,62,.18);cursor:pointer}
.tool img{transform-origin:50% 50%}
.tool img{width:17px;height:17px}

/* portrait + frame + vine */
.portrait{position:relative;width:min(100%,400px);margin-inline:auto;aspect-ratio:781/937}
.portrait .photo{position:absolute;left:11.8%;top:7.5%;width:75.9%;height:84.4%;
  border-radius:50%;overflow:hidden;background:#ddd6c4;
  box-shadow:inset 0 0 26px rgba(131,81,62,.34)}
.portrait .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity 1.05s ease}
.portrait .photo img.on{opacity:1}
.portrait .frame{position:absolute;inset:0;width:100%;z-index:2;
  filter:drop-shadow(0 16px 26px rgba(56,64,46,.26))}
.vine-layer{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.vine-layer.back{z-index:1}
.vine-layer.front{z-index:3}
.vbloom{position:absolute;translate:-50% -50%;pointer-events:none;opacity:0;
  filter:drop-shadow(1px 3px 3px rgba(74,46,35,.3));
  animation:vsway 6.5s ease-in-out infinite;animation-delay:var(--vd,0s)}
@keyframes vsway{0%,100%{rotate:-7deg;scale:.96}50%{rotate:7deg;scale:1.04}}
.breathe{transform-box:view-box;transform-origin:388.5px 465.5px;
  animation:breathe 11s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:rotate(-1.6deg) scale(.997)}50%{transform:rotate(1.6deg) scale(1.006)}}
.vine{fill:none;stroke:#27401A;stroke-width:7;stroke-linecap:round;
  filter:drop-shadow(1.5px 2.5px 2.5px rgba(25,38,16,.55))}
.vine-lit{fill:none;stroke:#A3CC72;stroke-width:2.6;stroke-linecap:round;opacity:.9;
  transform:translate(-1.2px,-2px)}
.vleaf{fill:#33511F;filter:drop-shadow(0 0 1.5px rgba(255,255,255,.8));opacity:0;
  transform-box:fill-box;transform-origin:0 50%;
  animation:bob 3.4s ease-in-out var(--d,0s) infinite}
@keyframes bob{0%,100%{translate:0 0;rotate:0deg}50%{translate:0 -3.5px;rotate:7deg}}
.vbud{opacity:0;transform-box:fill-box;transform-origin:50% 100%;
  filter:drop-shadow(0 1px 2px rgba(56,64,46,.35))}

.toolwrap,.tools{display:none}
#skills{background:linear-gradient(172deg,#FAD6D3 0%,#FDF2E6 46%,#F6DFB3 100%);
  min-height:100svh;display:grid;place-items:center;
  padding:clamp(1.5rem,4vh,3rem) 0;overflow:hidden;text-align:center}
#skills .wrap{position:relative;z-index:2}
#skills h2{position:absolute;left:-2%;bottom:-17%;width:86%;text-align:left;
  font-size:clamp(1.3rem,.8rem + 1.9vw,2.1rem);font-weight:700;white-space:nowrap}
.sk-lotus{position:absolute;z-index:1;pointer-events:none;opacity:.85;
  filter:drop-shadow(0 8px 14px rgba(131,81,62,.16))}
.sk-lotus.a{left:-3%;bottom:-4%;width:min(22vw,20vh,200px);rotate:-12deg}
.sk-lotus.b{right:-2%;top:3%;width:min(17vw,16vh,160px);rotate:14deg}
.envelope{position:relative;width:min(58vw,62vh,470px);margin:0 auto clamp(2.5rem,6vh,4.5rem);
  aspect-ratio:400/260}
.env-tilt{position:absolute;inset:0;rotate:-13deg}
.env{position:absolute;inset:0;width:100%;height:100%;overflow:visible;
  filter:drop-shadow(0 14px 22px rgba(131,81,62,.22))}
.env.back{z-index:1}
.env.front{z-index:3;filter:none}
.flap{transform-box:view-box;transform-origin:200px 64px}
.toolcloud{position:relative;z-index:4;width:min(74vw,520px);
  margin:0 auto -12vh;height:min(34vh,290px);
  rotate:-13deg;transform-origin:50% 96%}
.tcirc{position:absolute;translate:-50% -50%;width:var(--d,46px);display:grid;
  place-items:center;gap:.18rem;pointer-events:auto;cursor:pointer;opacity:0}
.tcirc i{width:var(--d,46px);height:var(--d,46px);border-radius:50%;display:grid;
  place-items:center;background:#FFF8EE;box-shadow:0 4px 10px rgba(131,81,62,.24);
  border:2px solid rgba(255,255,255,.85)}
.tcirc img{width:56%;height:56%;object-fit:contain}
.tcirc em{font-style:normal;font-weight:700;font-size:.78rem;color:var(--bole)}
.tcirc b{position:relative;z-index:3;font-size:.6rem;font-weight:600;letter-spacing:.02em;
  color:var(--ink);background:rgba(255,250,242,.92);padding:.1rem .36rem;border-radius:999px;
  white-space:nowrap;box-shadow:0 1px 3px rgba(131,81,62,.14)}
@media(max-width:860px){.envelope{width:min(84vw,52vh,360px);margin-top:0}
  .toolcloud{width:min(94vw,400px);height:min(30vh,250px);margin-bottom:-10vh}
  .tcirc{--d:40px}.tcirc b{font-size:.5rem}.tcirc em{font-size:.6rem}}

/* ---------- 2. table of contents ---------- */
#toc{background:#17394B;color:#FBEFE0;overflow:hidden;
  padding:clamp(4rem,9vw,7rem) 0}
#toc .water{position:absolute;inset:0;background:var(--a-water) 0 0/230px 230px repeat;
  opacity:.26;mix-blend-mode:screen}
#toc .water{position:absolute;inset:0;background:var(--a-water) center/cover no-repeat;opacity:1}
#toc .veil{position:absolute;inset:0;z-index:0;
  background:radial-gradient(112% 76% at 50% 44%,rgba(10,40,58,.34),rgba(8,32,48,.9))}
#toc .wrap{position:relative;z-index:2;text-align:center}
#toc h2{font-size:clamp(1.8rem,1rem + 3vw,2.9rem);font-weight:700}
#toc h2 .ini{color:var(--lotus)}
#toc>.wrap>p{color:rgba(251,239,224,.6);font-size:.82rem;letter-spacing:.16em;margin:.5rem 0 2.8rem}
.toclist{list-style:none;margin:0 auto;padding:0;max-width:34rem;text-align:left}
.toclist li{border-bottom:1px solid rgba(251,239,224,.16)}
.toclist a{display:flex;align-items:baseline;gap:1rem;padding:1.05rem .3rem;
  text-decoration:none;transition:padding-left .3s ease,color .3s ease}
.toclist a:hover,.toclist a:focus-visible{padding-left:1.1rem;color:var(--lotus)}
.toclist .n{font-family:Fraunces,serif;font-size:.85rem;color:var(--lotus);width:1.6rem;flex:none}
.toclist .t{font-family:Fraunces,serif;font-size:clamp(1.05rem,.85rem + .7vw,1.4rem);font-weight:600}
.toclist .c{margin-left:auto;font-size:.76rem;color:rgba(251,239,224,.45);flex:none}
.school{position:absolute;inset:0;z-index:0;pointer-events:none}
.fish{position:absolute;left:0;top:0;will-change:transform}
.fish img{display:block;width:100%;will-change:transform;
  filter:drop-shadow(0 4px 7px rgba(0,0,0,.3))}

/* ---------- content sections ---------- */
.band{padding:clamp(3.4rem,7vw,6rem) 0;background:linear-gradient(174deg,#FDF4E8 0%,#F6DFB3 100%)}
.band.alt{background:linear-gradient(174deg,#FAD6D3 0%,#FCEFE4 100%)}
.band .wrap{position:relative;z-index:1}
.lead{display:flex;align-items:baseline;gap:1rem;margin-bottom:2.4rem;
  border-bottom:1px solid rgba(131,81,62,.24);padding-bottom:1rem}
.lead .n{font-family:Fraunces,serif;font-size:.9rem;color:var(--lotus-deep);flex:none}
.lead h2{font-size:clamp(1.55rem,.95rem + 2.2vw,2.4rem);font-weight:700}
.lead p{margin:0 0 0 auto;font-size:.82rem;color:var(--silt);flex:none;text-align:right}
.grid{display:grid;gap:clamp(1.1rem,2.2vw,1.8rem);grid-template-columns:repeat(2,1fr)}
.card{position:relative;background:rgba(255,253,250,.88);border:1px solid rgba(131,81,62,.16);
  border-radius:3px 3px 16px 3px;padding:.95rem 1rem;display:flex;flex-direction:column}
.card > *{position:relative;z-index:1}
.card .slides{position:relative;aspect-ratio:16/9;border-radius:2px;overflow:hidden;
  background:rgba(131,81,62,.07)}
.card .slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity 1s ease}
.card .slides img.on{opacity:1}
.card .slides img:only-child{opacity:1}
.card figure{margin:0 0 .75rem}
.card figure img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:2px;
  background:rgba(56,64,46,.07)}
.card figure figcaption{font-size:.68rem;color:var(--silt);margin-top:.32rem;line-height:1.4}
.card h3{font-size:1rem;font-weight:700;line-height:1.3;margin-bottom:.1rem}
.card .meta{font-size:.71rem;color:var(--lotus-deep);letter-spacing:.06em;margin:.16rem 0 .55rem}
.card p{margin:0 0 .6rem;font-size:.82rem;line-height:1.55;color:#5C3B2C}
.card ul{margin:0 0 .65rem;padding-left:1rem;font-size:.8rem;line-height:1.52;color:#5C3B2C}
.card ul li{margin-bottom:.28rem}
.card .fill{font-style:italic;color:var(--silt)}
.card ul li{margin-bottom:.3rem}
.stack{margin-top:auto;display:flex;flex-wrap:wrap;gap:.34rem}
.stack span{font-size:.66rem;padding:.16rem .45rem;border-radius:999px;
  background:rgba(231,174,117,.22);color:#6B4030;letter-spacing:.03em}
.placeholder{border-style:dashed;background:rgba(255,255,255,.34)}
.placeholder p:not(.meta){color:var(--silt);font-style:italic}
.card p.fill{color:var(--silt);font-style:italic}
.card p.link{font-size:.78rem;margin:.1rem 0 .8rem}
.card p.link a{color:var(--lotus-deep);text-decoration:none;border-bottom:1px solid rgba(212,101,127,.4)}

.posters{overflow:hidden}
.deck{position:relative;height:clamp(330px,52vw,470px);margin:clamp(1rem,3vw,2rem) auto 0;
  width:100%;user-select:none;pointer-events:none}
.poster{position:absolute;left:50%;top:0;width:clamp(150px,22vw,238px);
  margin-left:calc(clamp(150px,22vw,238px) / -2);text-align:center;will-change:transform,filter}
.poster figure{margin:0;position:relative}
.poster .shot{width:100%;aspect-ratio:3/4;object-fit:contain;border-radius:4px 4px 14px 4px;
  background:#FBF3E6;border:1px solid rgba(131,81,62,.16);padding:4px;
  box-shadow:0 16px 28px rgba(74,46,35,.3)}
.poster figure::after{content:"";position:absolute;left:9%;right:9%;top:calc(100% + 9px);
  height:13px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(96,58,42,.36),transparent 72%)}
.poster h3{font-size:.98rem;font-weight:700;margin:1.5rem 0 0}
.poster .meta{font-size:.74rem;color:var(--lotus-deep);letter-spacing:.06em;margin:.15rem 0 0}
.deckbar{display:flex;align-items:center;justify-content:center;gap:1rem;
  margin-top:clamp(1rem,3vw,1.8rem)}
.dnav{width:38px;height:38px;border-radius:50%;border:1px solid rgba(131,81,62,.3);
  background:rgba(255,252,247,.8);color:var(--bole);font-size:1.3rem;line-height:1;
  cursor:pointer;transition:background .25s,color .25s}
.dnav:hover,.dnav:focus-visible{background:var(--bole);color:#FBEFE0}
.dots{display:flex;gap:.42rem}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(131,81,62,.28);
  transition:background .3s,width .3s}
.dots i.on{width:20px;border-radius:999px;background:var(--lotus-deep)}
@media(max-width:860px){.poster{width:clamp(136px,40vw,190px);
  margin-left:calc(clamp(136px,40vw,190px) / -2)}}

#org .grid,#bangkit .grid{grid-template-columns:1fr;gap:clamp(.9rem,1.8vw,1.4rem)}
#org .card,#bangkit .card{display:grid;align-items:start;gap:.1rem clamp(1rem,2vw,1.5rem);
  grid-template-columns:minmax(150px,26%) 1fr}
#org .card > figure,#bangkit .card > figure{grid-column:1;grid-row:1/span 9;margin:0}
#org .card > :not(figure),#bangkit .card > :not(figure){grid-column:2}
#org .card h3,#bangkit .card h3{margin-top:-.15rem}
#org .card .stack,#bangkit .card .stack{margin-top:.35rem}
@media(max-width:700px){
  #org .card,#bangkit .card{grid-template-columns:1fr}
  #org .card > figure,#bangkit .card > figure{grid-row:auto;margin-bottom:.7rem}
  #org .card > :not(figure),#bangkit .card > :not(figure){grid-column:1}
}

/* thesis feature */
#thesis{background:linear-gradient(160deg,#8C5A44 0%,#6B4030 60%,#4E2E22 100%);color:#FBEFE0;padding:clamp(3.6rem,8vw,6.5rem) 0;overflow:hidden}
#thesis::before{content:"";position:absolute;inset:0;
  background:radial-gradient(90% 70% at 78% 12%,rgba(231,174,117,.28),transparent 62%)}
#thesis .wrap{position:relative;z-index:1}
#thesis .lead{border-color:rgba(251,239,224,.2)}
#thesis .lead .n{color:var(--lotus)}
#thesis .lead p{color:rgba(251,239,224,.55)}
.feature{display:grid;gap:clamp(1.8rem,4vw,3.2rem);grid-template-columns:1.1fr .9fr;align-items:start}
.feature .stack{margin-top:1.5rem}
.feature h3{font-size:clamp(1.3rem,.9rem + 1.6vw,2rem);font-weight:700;margin-bottom:.6rem}
.feature p{font-size:.94rem;color:rgba(251,239,224,.82)}
.findings{list-style:none;padding:0;margin:1.4rem 0 0;display:grid;gap:.75rem}
.findings li{display:flex;gap:.8rem;font-size:.9rem;color:rgba(251,239,224,.86)}
.findings li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lotus);
  margin-top:.55rem;flex:none}
.shots{display:grid;gap:.9rem}
.shots img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:2px;
  background:rgba(251,239,224,.1);border:1px solid rgba(251,239,224,.18)}
.shots figcaption{font-size:.72rem;color:rgba(251,239,224,.5);margin-top:.35rem}
#thesis .stack span{background:rgba(251,239,224,.13);color:rgba(251,239,224,.85)}
.lotus-mark{position:absolute;right:-90px;bottom:-110px;width:360px;opacity:.2;z-index:0;rotate:-14deg}

/* honours */
.honour{display:grid;gap:1.6rem;grid-template-columns:repeat(2,1fr)}
.honour .card{border-left:3px solid var(--gold)}
.certhead{margin:clamp(2rem,4vw,3rem) 0 1rem;font-size:1.15rem;font-weight:700}
.certs{display:grid;gap:clamp(.9rem,2vw,1.5rem);
  grid-template-columns:repeat(auto-fit,minmax(185px,1fr))}
.certs figure{margin:0;background:rgba(255,253,250,.9);border:1px solid rgba(131,81,62,.16);
  border-radius:14px;padding:.7rem;box-shadow:0 6px 14px rgba(131,81,62,.1);
  display:flex;flex-direction:column}
.certs img{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:10px;display:block;
  background:#fff;padding:.4rem;box-shadow:inset 0 0 0 1px rgba(131,81,62,.1)}
.certs figcaption{font-size:.7rem;color:var(--silt);margin-top:.55rem;line-height:1.45;
  flex:1}

/* closing */
#end{height:82svh;min-height:440px;display:grid;place-items:center;text-align:center;
  background:linear-gradient(176deg,#F6DFB3 0%,#F3D2AE 52%,#E7AE75 100%);overflow:hidden}
#end .wrap{position:relative;z-index:1}
.bloomset{display:flex;align-items:flex-end;justify-content:center;
  width:min(92vw,520px);margin:0 auto 2rem}
.lo{position:relative;flex:none;display:block}
.lo.mid{width:46%;z-index:2;margin:0 -2%}
.lo.side{width:23%;z-index:1;margin-bottom:-1%}
.lo img{position:relative;z-index:2;display:block;width:100%;height:auto;
  filter:drop-shadow(0 7px 10px rgba(74,46,35,.3))}
.lo .lotusleaf{position:absolute;z-index:1;width:74%;left:13%;bottom:-9%;height:auto;
  opacity:.82;filter:drop-shadow(0 5px 7px rgba(74,46,35,.24))}
.lo.side .lotusleaf{width:88%;left:6%;bottom:-11%}
.bloom .stem{fill:none;stroke-width:7;stroke-linecap:round}
.bloom .pad{opacity:.92}
.bloom .petal{transform-box:view-box;transform-origin:150px 196px}
.bloom .heart{opacity:0}
#end h2{font-size:clamp(1.6rem,1rem + 2.4vw,2.6rem);font-weight:700}
#end p{color:var(--silt);max-width:40ch;margin:.7rem auto 1.8rem;font-size:.92rem}
.links{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
.links a{padding:.6rem 1.15rem;border:1px solid rgba(131,81,62,.34);border-radius:999px;
  text-decoration:none;font-size:.85rem;transition:background .25s,color .25s}
.links a:hover,.links a:focus-visible{background:var(--mud);color:var(--paper)}

/* ---------- responsive ---------- */
@media(max-width:860px){
  .fish{opacity:.62}
  .band.divider{padding-bottom:0}
  #about .wrap,.feature,.grid,.honour{grid-template-columns:1fr}
  .portrait{order:-1;width:min(74vw,320px)}
  .lead{flex-wrap:wrap}
  .lead p{margin-left:0;width:100%;text-align:left}
  #about{background-attachment:scroll}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .gate{display:none}
  .title{opacity:1!important;transform:none!important;transition:none}
  .school,.flutter{display:none}
  .wd{opacity:1!important;filter:none!important;transform:none!important}
  .breathe{animation:none}
  .vleaf{animation:none}
  .tool{opacity:1!important;transform:none!important;animation:none!important}
  .vine{stroke-dashoffset:0!important}
  .vleaf,.vbud{opacity:1!important;animation:none!important}
  .scrollcue{opacity:.8!important}
}
:focus-visible{outline:2px solid var(--lotus-deep);outline-offset:3px}

<script type="module">
/* ============================================================
   Content. Every word, link and photo on this page lives in
   content.json. This part reads it, fills the empty slots in the
   markup above, then waits for the ornament images and the fonts,
   so the motion further down starts on a page that looks exactly
   like the old single-file version.
   ============================================================ */
const $ = (sel, root = document) => root.querySelector(sel);
const at = (obj, path) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj);
/* "{Z}enitha" -> the flourished initial used in every heading */
const ini = s => String(s ?? '').replace(/\{(.)\}/gu, '<span class="ini">$1</span>');

function el(tag, attrs, html) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (html != null) e.innerHTML = ini(html);
  return e;
}
const each = (list, fn) => (list || []).forEach(fn);
const photo = (src, first, alt = '') => el('img', first ? { class: 'on', src, alt } : { src, alt });
const figure = (src, caption) => {
  const f = el('figure');
  f.append(el('img', { src, alt: '' }), el('figcaption', null, caption));
  return f;
};
const stack = (box, list) => { each(list, t => box.append(el('span', null, t))); return box; };

function lead(box, s = {}) {
  box.append(el('span', { class: 'n' }, s.number), el('h2', null, s.title));
  if (s.note) box.append(el('p', null, s.note));
}

function card(c) {
  const a = el('article', { class: 'card' });
  if (c.images?.length) {
    const fig = el('figure'), slides = el('div', { class: 'slides' });
    c.images.forEach((src, i) => slides.append(photo(src, i === 0)));
    fig.append(slides);
    if (c.caption) fig.append(el('figcaption', null, c.caption));
    a.append(fig);
  }
  a.append(el('h3', null, c.title));
  if (c.meta) a.append(el('p', { class: 'meta' }, c.meta));
  each(c.paragraphs, p => a.append(el('p', null, p)));
  if (c.points?.length) {
    const ul = el('ul');
    c.points.forEach(li => ul.append(el('li', null, li)));
    a.append(ul);
  }
  if (c.stack?.length) a.append(stack(el('div', { class: 'stack' }), c.stack));
  if (c.link) {
    const p = el('p', { class: 'link' });
    p.append(el('a', { href: c.link.url, target: '_blank', rel: 'noopener' }, c.link.text));
    a.append(p);
  }
  return a;
}

function render(C) {
  if (C.meta?.title) document.title = C.meta.title;
  if (C.meta?.description) $('meta[name="description"]').setAttribute('content', C.meta.description);

  document.querySelectorAll('[data-bind]').forEach(e => { e.innerHTML = ini(at(C, e.dataset.bind)); });
  document.querySelectorAll('[data-lead]').forEach(e => lead(e, at(C, e.dataset.lead)));
  document.querySelectorAll('[data-cards]').forEach(e => each(at(C, e.dataset.cards), c => e.append(card(c))));

  /* about: the bio is plain text, the script below lays it out word by word */
  $('.bio .type').dataset.text = C.about?.bio ?? '';
  const soft = C.about?.softSkills;
  if (soft?.items?.length) {
    $('.bio .soft dt').textContent = soft.title || 'Soft skills';
    stack($('.bio .soft dd'), soft.items);
  } else $('.bio .soft').remove();
  each(C.about?.education, d => {
    const dd = el('dd');
    each(d.details, t => dd.append(el('span', null, t)));
    $('.bio .edu:not(.soft)').append(el('dt', null, d.title), dd);
  });
  each(C.about?.photos, (p, i) => $('.portrait .photo').append(photo(p.image, i === 0, p.alt || '')));

  each(C.toc?.items, t => {
    const li = el('li'), a = el('a', { href: t.href });
    a.append(el('span', { class: 'n' }, t.number), el('span', { class: 't' }, t.title),
             el('span', { class: 'c' }, t.note));
    li.append(a);
    $('.toclist').append(li);
  });

  each(C.thesis?.findings, f => $('#thesis .findings').append(el('li', null, f)));
  stack($('#thesis .stack'), C.thesis?.stack);
  each(C.thesis?.shots, s => $('#thesis .shots').append(figure(s.image, s.caption)));

  const deck = $('#deck');
  deck.setAttribute('aria-label', C.posters?.label ?? '');
  each(C.posters?.items, p => {
    const art = el('article', { class: 'poster' }), fig = el('figure');
    fig.append(el('img', { class: 'shot', src: p.image, alt: '' }));
    art.append(fig, el('h3', null, p.title), el('p', { class: 'meta' }, p.meta));
    deck.append(art);
  });

  each(C.honours?.certificates, c => $('.certs').append(figure(c.image, c.caption)));
  each(C.contact?.links, l => $('#end .links').append(el('a', { href: l.url }, l.label)));
}

/* Ornaments and animation frames (lotus, koi, butterflies, the blooming
   lotus) are part of the design, so the code knows their names. They are
   loaded up front, like they were when they sat inside the file. */
const DECOR = 'assets/decor/';
const seq = (p, n) => Array.from({ length: n }, (_, i) => `${p}-${i}.webp`);
const IMG = Object.fromEntries([...new Set([
  ...[...document.querySelectorAll('[data-a]')].map(e => e.dataset.a),
  ...seq('bs', 14), ...seq('kr', 13), ...seq('kb', 13), ...seq('kp', 13), ...seq('bl', 8)
])].map(f => [f, new URL(DECOR + f, document.baseURI).href]));
const held = [];                               /* keeps the preloaded frames in memory */

function preload(src) {
  const im = new Image();
  im.fetchPriority = 'high';
  im.src = src;
  held.push(im);
  return im.decode();
}

function problem(err) {
  const box = document.createElement('div');
  box.setAttribute('role', 'alert');
  box.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;z-index:99;max-width:36rem;' +
    'margin:auto;padding:14px 18px;border-radius:12px;background:#FBEFE0;color:#4A2E23;' +
    'border:1px solid rgba(131,81,62,.3);box-shadow:0 10px 28px rgba(74,46,35,.25);' +
    'font:500 15px/1.5 Karla,system-ui,sans-serif';
  const where = /line (\d+) column (\d+)/i.exec(err.message);
  box.textContent = location.protocol === 'file:'
    ? 'Konten belum bisa dimuat karena halaman dibuka langsung dari file. Jalankan server lokal ' +
      'dulu (lihat README), lalu buka http://localhost:8000.'
    : err.name === 'SyntaxError'
      ? `content.json tidak bisa dibaca${where ? ` di baris ${where[1]}, kolom ${where[2]}` : ''}. ` +
        'Biasanya ada koma berlebih atau tanda kutip yang kurang di sekitar situ.'
      : `Konten gagal dimuat: ${err.message}. Cek lagi struktur content.json.`;
  document.body.append(box);
}

async function boot() {
  const got = fetch('content.json');
  /* The ornaments don't depend on content.json, so start them as soon as the page
     itself has loaded (not earlier: the motion code must still start after that event). */
  await new Promise(r => document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true }));
  const decor = Object.values(IMG).map(src => preload(src).catch(() => {}));
  const res = await got;
  if (!res.ok) throw new Error(`content.json tidak ditemukan (HTTP ${res.status})`);
  const C = await res.json();
  render(C);
  void document.body.offsetHeight;             /* lay the text out once so its fonts start loading */
  await Promise.race([
    Promise.allSettled([document.fonts.ready, ...decor]),
    new Promise(r => setTimeout(r, 4000))      /* never hold the page longer than this */
  ]);
  return C;
}

let C;
try { C = await boot(); } catch (err) { problem(err); throw err; }

   Motion. Unchanged from the single-file version.

const PETALS=["<svg class=\"petal-fall\" viewBox=\"0 0 40 58\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"pf0\" x1=\"0\" y1=\"1\" x2=\"0\" y2=\"0\"><stop offset=\"0\" stop-color=\"#E491B0\"/><stop offset=\"1\" stop-color=\"#F7D3DF\"/></linearGradient></defs><path d=\"M20,3 C33,17 36,39 20,55 C4,39 7,17 20,3 Z\" fill=\"url(#pf0)\"/><path d=\"M20,7 C27,20 28,38 20,50\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".35\" stroke-width=\"1.6\"/></svg>", "<svg class=\"petal-fall\" viewBox=\"0 0 40 58\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"pf1\" x1=\"0\" y1=\"1\" x2=\"0\" y2=\"0\"><stop offset=\"0\" stop-color=\"#EDAAC4\"/><stop offset=\"1\" stop-color=\"#FBE3EA\"/></linearGradient></defs><path d=\"M20,3 C33,17 36,39 20,55 C4,39 7,17 20,3 Z\" fill=\"url(#pf1)\"/><path d=\"M20,7 C27,20 28,38 20,50\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".35\" stroke-width=\"1.6\"/></svg>", "<svg class=\"petal-fall\" viewBox=\"0 0 40 58\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"pf2\" x1=\"0\" y1=\"1\" x2=\"0\" y2=\"0\"><stop offset=\"0\" stop-color=\"#DC7EA2\"/><stop offset=\"1\" stop-color=\"#F2BFD2\"/></linearGradient></defs><path d=\"M20,3 C33,17 36,39 20,55 C4,39 7,17 20,3 Z\" fill=\"url(#pf2)\"/><path d=\"M20,7 C27,20 28,38 20,50\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".35\" stroke-width=\"1.6\"/></svg>"];
const TOOLS = C.skills.tools;

/* tools spill out of the envelope, then keep cycling colour; tap one to pop it */
(function () {
  const box = document.getElementById('tools');
  if (!box) return;
  const TINT = ['#F28AA1', '#EC9B8D', '#E7AE75', '#EFC78F', '#F6DFB3',
                '#F4D9C4', '#FAD6D3', '#E79AB4', '#D4657F'];
  const n = TOOLS.length;
  const SHORT = { 'Istio': 'Is', 'Flagger': 'Fl', 'k6': 'k6', 'Power BI': 'BI' };
  /* a cone: wide at the top, narrowing down into the mouth of the envelope */
  const TIERS = [6, 5, 4, 2];
  const seat = [];
  let row = 0, used = 0;
  for (let i = 0; i < n; i++) {
    if (used >= TIERS[Math.min(row, TIERS.length - 1)]) { row++; used = 0; }
    seat.push([row, used++]);
  }
  const rows = seat[n - 1][0] + 1;
  TOOLS.forEach((tl, i) => {
    const [r, c] = seat[i];
    const cnt = TIERS[Math.min(r, TIERS.length - 1)];
    const narrow = innerWidth < 780;
    const spread = (narrow ? 33 : 42) - r * (narrow ? 4.4 : 5.6);   // each tier tucks in
    const x = 50 + (cnt === 1 ? 0 : ((c / (cnt - 1)) - .5) * spread * 2);
    const y = 7 + (r / (rows - 1)) * 86;
    const s = document.createElement('span');
    s.className = 'tcirc';
    s.style.left = (x + ((i * 7) % 5 - 2) * .35) + '%';
    s.style.top = (y + ((i * 11) % 3 - 1) * .5) + '%';
    const face = tl.icon ? `<img src="${tl.icon}" alt="">`
                         : `<em>${SHORT[tl.name] || tl.name.slice(0, 2)}</em>`;
    s.innerHTML = `<i>${face}</i><b>${tl.name}</b>`;
    box.appendChild(s);
  });
  const chips = [...box.children];
  chips.forEach((c, i) => {
    c.tabIndex = 0;
    let p = i;
    const hit = () => {
      p++;
      gsap.to(c.querySelector('i'), { backgroundColor: TINT[p % TINT.length], duration: .3 });
      gsap.fromTo(c.querySelector('i'),
        { scale: 1 }, { scale: 1.45, duration: .17, yoyo: true, repeat: 1, ease: 'power2.out' });
    };
    c.addEventListener('click', hit);
    c.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hit(); } });
  });
  if (RM || !window.gsap) { chips.forEach(c => c.style.opacity = 1); return; }

  /* each chip sits upright even though the whole cone leans with the envelope */
  gsap.set(chips, { opacity: 0, scale: .2, rotation: 13, xPercent: -50, yPercent: -50 });
  const seatOf = c => [parseFloat(c.style.left), parseFloat(c.style.top)];

  /* the whole cycle: the flap lifts, the tools tip out, they go back, it shuts again */
  gsap.set('.flap', { scaleY: 1, svgOrigin: '200 64' });
  gsap.set('.flap path:last-child', { opacity: .07 });

  const spill = gsap.timeline({ repeat: -1, repeatDelay: .7, paused: true });
  spill.to('.flap', { scaleY: -.86, svgOrigin: '200 64', duration: .8, ease: 'power2.inOut' }, 0)
       .to('.flap path:last-child', { opacity: .16, duration: .5 }, 0);
  chips.forEach((c, i) => {
    const [l, tp] = seatOf(c);
    spill.fromTo(c, { left: '50%', top: '116%', opacity: 0, scale: .16, rotation: -46 },
                    { left: l + '%', top: tp + '%', opacity: 1, scale: 1, rotation: 13,
                      duration: 1.15, ease: 'back.out(1.35)' }, .55 + i * .13);
  });
  spill.to(chips, { left: '50%', top: '116%', opacity: 0, scale: .16, rotation: 52,
                    duration: .95, ease: 'power2.in',
                    stagger: { each: .07, from: 'end' } }, '+=5.5')
       .to('.flap', { scaleY: 1, svgOrigin: '200 64', duration: .8, ease: 'power2.inOut' }, '>-.35')
       .to('.flap path:last-child', { opacity: .07, duration: .5 }, '<');

  ScrollTrigger.create({ trigger: '.envelope', start: 'top 82%', once: true,
                         onEnter: () => spill.play() });
})();

/* bio settles into place word by word */

/* the two portraits trade places */
(function () {
  const shots = document.querySelectorAll('.photo img');
  let n = 0;

const live = window.gsap && window.ScrollTrigger && !RM;

if (!live) {
  /* no library, or the reader asked for less motion: everything at rest */
  document.querySelectorAll('.door').forEach(d => d.style.display = 'none');
  document.querySelector('.title').style.opacity = 1;
  document.querySelector('.title h1').style.setProperty('--p', '115%');
  document.querySelector('.title p').style.opacity = 1;
  document.querySelector('.scrollcue').style.opacity = .8;
  document.querySelectorAll('.vleaf,.vbud').forEach(e => e.style.opacity = 1);
  document.querySelectorAll('.fish').forEach((f, i) => {
    f.style.cssText += `left:${9 + i * 18}%;top:${f.dataset.top}%;width:${f.dataset.size}px;opacity:.6`;
  });
} else {
  gsap.registerPlugin(ScrollTrigger, MotionPathPlugin);
  const rnd = gsap.utils.random;

  /* ---------- 0. the cluster parts, and comes back together on the way out */
  const vw = n => n / 100 * window.innerWidth, vh = n => n / 100 * window.innerHeight;
  const gateTL = gsap.timeline({ paused: true });
  /* The clearing is a tilted oval measured from the real title box, so it stays
     roomy on a wide laptop and on a narrow phone alike. */
  const TILT = -12 * Math.PI / 180, CT = Math.cos(TILT), ST = Math.sin(TILT);
  function oval() {
    const box = document.querySelector('#cover').getBoundingClientRect();
    const h1 = document.querySelector('.title h1').getBoundingClientRect();
    const cx = h1.left - box.left + h1.width / 2;
    const cy = h1.top - box.top + h1.height / 2;
    let rx = Math.max(box.width * .30, h1.width * .62);
    let ry = Math.max(box.height * .17, h1.height * 1.15);
    /* the name is level but the oval leans, so grow it until all four corners
       of the text box sit inside. Otherwise the ends poke out under a bloom. */
    const a = h1.width / 2 + box.width * .05;
    const b = h1.height / 2 + box.height * .07;
    let need = 0;
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
      const dx = a * sx, dy = b * sy;
      need = Math.max(need, Math.hypot((dx * CT + dy * ST) / rx,
                                       (-dx * ST + dy * CT) / ry));
    }
    const grow = Math.max(1, need) * 1.06;
    return { cx, cy, rx: rx * grow, ry: ry * grow };
  }
  /* where one bloom ends up once the oval opens */
  function slot(el) {
    const o = oval();
    /* a bloom is not a dot. Widen the oval by its own half size, otherwise one
       whose centre sits just outside still hangs its petals over the letters. */
    const rx = o.rx + el.offsetWidth * .34;
    const ry = o.ry + el.offsetHeight * .34;
    const dx = el.offsetLeft - o.cx, dy = el.offsetTop - o.cy;
    let u = (dx * CT + dy * ST) / rx;
    let v = (-dx * ST + dy * CT) / ry;
    let d = Math.hypot(u, v);
    if (d >= 1) return { x: o.cx + dx * 1.05, y: o.cy + dy * 1.06, s: 1, out: 0 };
    if (d < .04) {                       /* dead centre: pick a direction and go */
      const a = (el.dataset.r0 | 0) * 2.4;
      u = Math.cos(a); v = Math.sin(a); d = 1;
    }
    const k = (1.03 + (1 - d) * .3) / d;
    const nu = u * k * rx, nv = v * k * ry;
    return {
      x: o.cx + nu * CT - nv * ST,
      y: o.cy + nu * ST + nv * CT,
      s: .8, out: v > 0 ? 1 : -1
    };
  }

  document.querySelectorAll('.g').forEach(el => {
    const d = el.dataset;
    gateTL.fromTo(el,
      { x: 0, y: 0, rotation: +d.r0, scale: 1 },
      { x: () => slot(el).x - el.offsetLeft,
        y: () => slot(el).y - el.offsetTop,
        rotation: () => +d.r0 + slot(el).out * 16,
        scale: () => slot(el).s,
        ease: 'power2.inOut', duration: 1 }, 0);
  });

  gateTL
    .to('.title', { opacity: 1, duration: .22 }, .24)
    .to('.scrollcue', { opacity: .8, duration: .3 }, 1.15);

  /* the name is painted on with a brush once the oval is mostly open */
  let written = false;
  const write = on => {
    written = on;
    gsap.to('.title h1', { '--p': on ? '112%' : '-12%', ease: 'none', duration: on ? .8 : .3 });
  };
  gateTL.eventCallback('onUpdate', () => {
    const p = gateTL.progress();
    if (!written && p > .42) write(true);
    else if (written && p < .3) write(false);
  });

  let ready = false, scrubbing = false;
  const openSlow = () => { gateTL.timeScale(.62); gateTL.play(); };
  gateTL.eventCallback('onComplete', () => { ready = true; });
  gsap.delayedCall(.95, openSlow);

  ScrollTrigger.create({
    trigger: '#cover', start: 'top top', end: 'bottom top', scrub: .4,
    invalidateOnRefresh: true,
    onUpdate: self => {
      /* the finger only takes over once the flowers are open and we are back at the top */
      if (!ready) return;
      if (!scrubbing) { if (self.progress > .02) return; scrubbing = true; }
      if (gateTL.isActive()) gateTL.pause();
      gateTL.progress(1 - self.progress);
    },
    /* left the cover behind: shut the flowers again, out of sight */
    onLeave: () => { ready = scrubbing = false; gateTL.pause(0); },
    /* came back up to it: they are closed, and they open again, slowly */
    onEnterBack: () => {
      ready = scrubbing = false;
      gateTL.pause(0);
      gsap.delayedCall(.95, openSlow);
    }
  });

  /* ---------- 0b. lotus petals drifting down across the cover */
  (function () {
    const box = document.querySelector('.petals');
    for (let i = 0; i < 11; i++) {
      const s = document.createElement('span');
      s.className = 'pf';
      s.innerHTML = PETALS[i % PETALS.length];
      s.style.width = rnd(16, 34, 1) + 'px';
      box.appendChild(s);
      const drift = () => {
        const w = innerWidth, h = innerHeight;
        gsap.set(s, { x: rnd(-.05, 1.05) * w, y: -70, rotation: rnd(0, 360), opacity: rnd(.5, .95) });
        gsap.to(s, {
          y: h + 80, duration: rnd(11, 22), ease: 'none',
          delay: i === -1 ? 0 : rnd(0, 1.5), onComplete: drift
        });
        gsap.to(s, { x: '+=' + rnd(-110, 110), duration: rnd(4, 8), yoyo: true, repeat: -1, ease: 'sine.inOut' });
        gsap.to(s, { rotation: '+=' + rnd(180, 520), duration: rnd(7, 14), repeat: -1, ease: 'none' });
      };
      gsap.delayedCall(rnd(0, 14), drift);
    }
  })();

  /* ---------- 0c. two butterflies: drift to the edges, then perch on something */
  (function () {
    const box = document.querySelector('.flutter');
    const PERCH = ['.title h1', '.bio h2', '.portrait', '.toclist .t',
                   '#project-cards .card h3', '.lead h2', '.bloom.tall', '.links a'];
    const bugs = [];
    for (let i = 0; i < 2; i++) {
      const s = document.createElement('span');
      s.className = 'bf';
      s.innerHTML = '<img alt="">';
      s.style.width = [104, 86][i] + 'px';
      box.appendChild(s);
      gsap.set(s, { x: innerWidth * [.12, .88][i], y: innerHeight * [.68, .26][i] });
      const im = s.firstElementChild;
      im.src = IMG['bs-0.webp'];
      bugs.push({ el: s, im, sat: null, hops: 2, k: Math.random() * 8, lane: i,
                  px: 0, py: 0, bob: i * 3, face: 1, sx: -1 });
    }

    const CYCLE = Array.from({ length: 14 }, (_, i) => `bs-${i}.webp`);
    const flap = (b, on) => { b.fast = on; };
    /* a little glitter shaken loose while they fly */
    const spark = b => {
      if (Math.random() > .22) return;
      const r = b.el.getBoundingClientRect();
      const d = document.createElement('i');
      d.className = 'glit';
      const s = rnd(3, 7, 1);
      d.style.cssText = `width:${s}px;height:${s}px;left:${r.left + r.width * rnd(.15, .7)}px;` +
                        `top:${r.top + r.height * rnd(.35, .8)}px;` +
                        `background:${['#F6DFB3', '#F28AA1', '#FFF3D6', '#E7AE75'][(Math.random() * 4) | 0]}`;
      box.appendChild(d);
      gsap.to(d, { x: rnd(-26, 26), y: rnd(14, 46), opacity: 0, scale: .2,
                   duration: rnd(.8, 1.6), ease: 'power1.out',
                   onComplete: () => d.remove() });
    };

    gsap.ticker.add(() => {
      bugs.forEach(b => {
        const flying = b.fast !== false;
        if (!flying) {                                  /* perched, wings held up, side on */
          b.k += .014;                                  /* the slowest breath */
          const r = IMG[CYCLE[Math.floor(b.k) % 2 ? 2 : 3]];
          if (b.im.src !== r) b.im.src = r;
          return;
        }
        b.k += .42;                                     /* one beat per third of a second */
        const src = IMG[CYCLE[Math.floor(b.k) % CYCLE.length]];
        if (b.im.src !== src) b.im.src = src;
        spark(b);
        /* face the way it travels, tip the nose with the climb, and bob as it goes */
        const r = b.el.getBoundingClientRect();
        const dx = r.left - b.px, dy = r.top - b.py;
        b.px = r.left; b.py = r.top;
        b.bob += .1;
        if (Math.abs(dx) > .3) b.face = dx < 0 ? -1 : 1;
        b.sx += (-b.face - b.sx) * .1;                  // swings round instead of snapping
        gsap.set(b.im, {
          scaleX: b.sx,
          rotation: Math.max(-28, Math.min(28, dy * 3)) + Math.sin(b.bob) * 8,
          y: Math.sin(b.bob * 1.7) * 6
        });
      });
    });

    const spots = () => {
      const out = [];
      PERCH.forEach(sel => document.querySelectorAll(sel).forEach(el => {
        const r = el.getBoundingClientRect();
        if (r.width < 24 || r.height < 6 || r.bottom < 70 || r.top > innerHeight - 70) return;
        out.push({ el, dx: .14 + Math.random() * .7, dy: -.12 });
      }));
      return out;
    };

    /* the moment the page moves they let go and fly again */
    addEventListener('scroll', () => bugs.forEach(b => {
      if (!b.sat) return;
      b.sat = null;
      flap(b, true);
      gsap.killTweensOf(b.el);
      gsap.delayedCall(.05, () => go(b));
    }), { passive: true });

    const go = b => {
      const edge = b.hops % 3 !== 2;              // two wanders, then a landing
      b.hops++;
      b.sat = null;
      flap(b, true);
      let tx, ty, hold;
      if (edge) {
        const lane = [[.02, .24], [.76, .98]][b.lane];      /* they keep to the margins */
        tx = innerWidth * rnd(lane[0], lane[1]);
        ty = innerHeight * rnd(.1, .84);
        hold = rnd(.6, 1.6);
      } else {
        const list = spots();
        if (!list.length) { tx = innerWidth * rnd(.1, .9); ty = innerHeight * rnd(.2, .8); hold = .6; }
        else {
          const s = list[Math.floor(Math.random() * list.length)];
          const r = s.el.getBoundingClientRect();
          tx = r.left + r.width * s.dx;
          ty = r.top + r.height * s.dy;
          hold = rnd(2.6, 5);
          b.pending = s;
        }
      }
      gsap.to(b.el, {
        x: tx, y: ty, duration: rnd(2.2, 3.6), ease: 'sine.inOut',
        onComplete() {
          if (!edge && b.pending) { b.sat = b.pending; b.pending = null; flap(b, false);
            gsap.to(b.im, { rotation: 0, y: 0, duration: .35 }); }
          gsap.delayedCall(hold, () => go(b));
        }
      });
    };
    bugs.forEach((b, i) => gsap.delayedCall(1 + i * 1.4, () => go(b)));
  })();

  /* ---------- 1. the wreath is already wound when you arrive; it only sways */
  (function () {
    gsap.set('.vleaf', { opacity: 1, scale: 1, transformOrigin: '0px 50%' });
    gsap.set('.vbud', { opacity: 1, scale: 1, transformOrigin: '50% 100%' });
    gsap.set('.vbloom', { opacity: 1, scale: 1, transformOrigin: '50% 50%' });
  })();

  /* ---------- 2. koi from above, wandering their own lazy loops */
  let fishTweens = [], pondOn = false;
  const shoal = [];
  gsap.ticker.add(() => {
    if (!pondOn) return;
    shoal.forEach(s => {
      const p = s.swim.progress();
      let d = p - s.last;
      if (d < -.5) d += 1; else if (d > .5) d -= 1;
      s.last = p;
      s.run += Math.abs(d) * s.dur * 5.4;          /* distance, not clock time */
      const k = Math.floor(s.run) % 13;
      if (k !== s.shown) { s.img.src = s.frames[k]; s.shown = k; }
      gsap.set(s.img, { scaleX: 1 + Math.sin(s.run * .8) * .05 });
    });
  });

  function build() {
    fishTweens.forEach(t => t.kill());
    fishTweens = [];
    shoal.length = 0;
    const pond = document.getElementById('toc');
    const W = pond.clientWidth, H = pond.clientHeight;
    const fit = Math.min(1, .46 + W / 1700);   // a narrow pond gets smaller fish

    document.querySelectorAll('.fish').forEach((f, n) => {
      const size = +f.dataset.size * fit, dur = +f.dataset.dur, off = +f.dataset.off;
      const img = f.firstElementChild;
      gsap.set(f, { width: size, opacity: .95 - n * .05 });

      /* each fish owns a corner of the pond, so their circuits never cross */
      const ZONE = [[.17, .30], [.83, .28], [.50, .58], [.19, .82], [.82, .80]][n % 5];
      const cx = W * ZONE[0], cy = H * ZONE[1];
      const rx = W * (.105 + .02 * (n % 3));
      const ry = H * (.115 + .025 * (n % 2));
      const k = 7 + n % 3, pts = [];
      for (let i = 0; i < k; i++) {
        const a = i / k * Math.PI * 2 + n * 1.3;
        const wob = .62 + .7 * (((i * 7 + n * 5) % 6) / 6);
        pts.push({ x: cx + Math.cos(a) * rx * wob, y: cy + Math.sin(a) * ry * wob });
      }
      pts.push({ ...pts[0] });

      const swim = gsap.to(f, {
        duration: dur, repeat: -1, ease: 'none',
        motionPath: { path: pts, curviness: 1.6, autoRotate: off, alignOrigin: [.5, .5] }
      });
      swim.progress(Math.random());
      fishTweens.push(swim);

      /* the tail beats in step with how far it has actually moved, so a
         gliding fish barely flicks and a darting one works hard */
      const key = f.dataset.koi;
      const frames = Array.from({ length: 13 }, (_, k) => IMG[`${key}-${k}.webp`]);
      img.src = frames[0];
      fishTweens.push(gsap.to(swim, {
        timeScale: rnd(.42, 1.75), duration: rnd(2.4, 4.8),
        yoyo: true, repeat: -1, ease: 'sine.inOut'
      }));
      shoal.push({ img, frames, swim, dur, last: swim.progress(), run: Math.random() * 8, shown: -1 });
    });
  }

  const pondView = ScrollTrigger.create({
    trigger: '#toc', start: 'top bottom', end: 'bottom top',
    onToggle: self => {
      pondOn = self.isActive;
      fishTweens.forEach(t => self.isActive ? t.play() : t.pause());
    }
  });
  function school() { build(); pondOn = pondView.isActive;
    if (!pondOn) fishTweens.forEach(t => t.pause()); }
  school();

  /* ---------- 4. the lotus at the end opens once you arrive, bud first */
  (function () {
    const BL = Array.from({ length: 8 }, (_, k) => IMG[`bl-${k}.webp`]);
    const set = [...document.querySelectorAll('.lo')];
    set.forEach(l => { l.firstElementChild.nextElementSibling.src = BL[0]; });
    gsap.set('.lo .lotusleaf', { opacity: 0, scale: .5, transformOrigin: '50% 90%' });

    const clock = { i: 0 };
    const tl = gsap.timeline({ paused: true });
    tl.to('.lo .lotusleaf', { opacity: .9, scale: 1, duration: .8,
                              ease: 'back.out(1.6)', stagger: .18 }, 0)
      .to(clock, {
        i: 7.99, duration: 2.8, ease: 'power1.inOut',
        onUpdate() {
          set.forEach((l, n) => {
            const k = Math.max(0, Math.min(7, Math.floor(clock.i - (n === 1 ? 0 : .9))));
            const img = l.querySelector('img');
            if (img.src !== BL[k]) img.src = BL[k];
          });
        }
      }, .35);

    ScrollTrigger.create({
      trigger: '.bloomset', start: 'top 82%',
      onEnter: () => tl.play(),
      onLeaveBack: () => { tl.pause(0); clock.i = 0;
        set.forEach(l => l.querySelector('img').src = BL[0]); }
    });
  })();

  /* ---------- 4b. cards that carry more than one photo cross-fade between them */
  (function () {
    document.querySelectorAll('.card .slides').forEach((box, n) => {
      const shots = [...box.querySelectorAll('img')];
      if (shots.length < 2) return;
      let i = 0;
      setInterval(() => {
        shots[i].classList.remove('on');
        i = (i + 1) % shots.length;
        shots[i].classList.add('on');
      }, 3800 + n * 420);
    });
  })();

  /* ---------- 5. the poster deck: drifts along on its own */
  (function () {
    const deck = document.getElementById('deck');
    if (!deck) return;
    const cards = [...deck.querySelectorAll('.poster')];
    const dots = document.getElementById('dots');
    const N = cards.length;
    let at = Math.floor(N / 2), auto = null;

    cards.forEach(() => dots.appendChild(document.createElement('i')));

    const step = () => cards[0].offsetWidth * (innerWidth < 760 ? .82 : 1.1);

    /* everything eases across as the centre moves along the row */
    function lay(i, snap) {
      cards.forEach((c, k) => {
        const d = k - i, a = Math.abs(d);
        const near = Math.min(a, 1);
        gsap.to(c, {
          x: d * step(),
          y: -20 + Math.min(a, 3) * 26,
          scale: a < 1 ? 1 - near * .2 : Math.max(.58, .8 - (a - 1) * .1),
          opacity: a < 1 ? 1 - near * .48 : Math.max(0, .52 - (a - 1) * .22),
          filter: `blur(${(a < 1 ? near * 3 : 3 + (a - 1) * 3.6).toFixed(2)}px)`,
          zIndex: Math.round(30 - a * 2),
          duration: snap ? .8 : 0, ease: 'power3.out', overwrite: 'auto'
        });
      });
      if (snap) [...dots.children].forEach((d, k) => d.classList.toggle('on', k === Math.round(i)));
    }

    const go = i => { at = (i % N + N) % N; lay(at, true); };
    const rest = () => { clearInterval(auto); if (!RM) auto = setInterval(() => go(at + 1), 2600); };

    lay(at, false);
    addEventListener('resize', () => lay(at, false));
    ScrollTrigger.create({ trigger: deck, start: 'top 85%', end: 'bottom 15%',
      onToggle: self => self.isActive ? rest() : clearInterval(auto) });
  })();

  let rt;
  addEventListener('resize', () => { clearTimeout(rt);
    rt = setTimeout(() => { gateTL.invalidate(); school(); }, 250); });
}

/* ============================================================
   The single-file version got one ScrollTrigger refresh from the
   window load event, once every image had its size. Now that the
   content arrives by fetch, that event has usually passed already,
   so the same refresh is asked for here.
   ============================================================ */
Promise.allSettled([...document.images].map(i => i.decode())).then(() => {
  if (live && document.readyState === 'complete') ScrollTrigger.refresh();
});
</script>
</body>
</html>
